[pytest]
DJANGO_SETTINGS_MODULE = digiturno.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests *Test

python_functions = test_*
testpaths = tests
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --reuse-db
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    models: marks tests as model tests
    views: marks tests as view tests
    serializers: marks tests as serializer tests
    logic: marks tests as business logic tests
    auth: marks tests as authentication tests
    reports: marks tests as reports tests
filterwarnings =
    ignore::django.utils.deprecation.RemovedInDjango60Warning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
